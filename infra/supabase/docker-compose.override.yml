# ==========================================================================
# OdontoCampus — Ajustes sobre el docker-compose oficial de Supabase
#
# Copiar a /opt/supabase/docker-compose.override.yml
# Docker Compose lo aplica solo, sin tocar el docker-compose.yml original:
# así se puede actualizar Supabase sin perder estos cambios.
#
# --------------------------------------------------------------------------
# ESCRITO PARA LA VERSIÓN INSTALADA EN SEPTIEMBRE DE 2026
#
# Verificada con `docker compose --profile "*" config --services`:
#   studio, api-gw (Envoy), auth, rest, realtime, storage, imgproxy, meta,
#   functions, db, supavisor
#
# AL ACTUALIZAR SUPABASE, volvé a correr ese comando antes de levantar.
# Los nombres cambian entre versiones: en esta el gateway ya no es `kong`
# sino `api-gw`, y `analytics` directamente no existe. Si un servicio de
# este archivo no aparece en la lista, Compose falla al arrancar.
#
# --------------------------------------------------------------------------
# LOS PUERTOS TIENEN TRES CAPAS DE PROTECCIÓN
#
#   1. "ip": "127.0.0.1" en /etc/docker/daemon.json. Todo puerto publicado
#      sin dirección queda en la máquina local, se llame como se llame el
#      servicio. Es la red de seguridad que no depende de este archivo.
#   2. Este archivo, que ata explícitamente los puertos que conocemos.
#   3. La verificación desde afuera, que confirma que las otras dos
#      funcionan de verdad.
#
#   Docker escribe sus propias reglas de iptables y saltea el firewall del
#   sistema: el panel de CloudPanel no sirve para comprobar nada de esto.
#
# REQUISITO: Docker Compose v2.20 o superior, por la etiqueta !override.
# ==========================================================================

services:

  # ------------------------------------------------------------------
  # Gateway (Envoy). Es lo único que el proxy de CloudPanel alcanza:
  #   api.odontocampus.com.ar → http://127.0.0.1:8000
  #
  # En esta versión no publica el 8443, así que ya no choca con el panel
  # de CloudPanel como pasaba con Kong.
  # ------------------------------------------------------------------
  api-gw:
    ports: !override
      - "127.0.0.1:8000:8000/tcp"

  # ------------------------------------------------------------------
  # Supavisor: el pooler de conexiones, y la única vía a Postgres desde el
  # host (el servicio `db` no publica ningún puerto en esta versión).
  # Queda en la máquina local. Para administrar la base desde tu
  # computadora, túnel SSH:
  #   ssh -p 5469 -L 5432:127.0.0.1:5432 root@179.43.126.185
  # ------------------------------------------------------------------
  supavisor:
    ports: !override
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:6543:6543"

  # ------------------------------------------------------------------
  # Auth (GoTrue) — cuentas con CORREO Y CONTRASEÑA
  #
  # El correo se usa sólo para dos cosas:
  #   · confirmar la cuenta, una única vez      (plantilla confirmation)
  #   · elegir una contraseña nueva si se olvidó (plantilla recovery)
  #
  # Los dos correos traen un botón que abre el sitio con un token en la
  # dirección. El sitio lo canjea con POST /auth/v1/verify. Nunca se usa el
  # enlace GET de Supabase: los antivirus de correo abren los enlaces antes
  # que la persona y lo gastarían (ver public/js/auth.js).
  #
  # El ingreso por código o enlace mágico (/auth/v1/otp y /auth/v1/magiclink)
  # queda cerrado en el Vhost de la API, no acá: GoTrue no tiene una opción
  # para apagarlo sin apagar también el registro.
  #
  # Las plantillas las sirve el propio sitio (public/email/). El ?v= de la
  # dirección es obligatorio: el Vhost manda diez años de caché, así que
  # sin cambiar la dirección GoTrue seguiría bajando la plantilla vieja.
  # Después de cambiar una plantilla: git pull en el sitio, subir el ?v=
  # acá y `docker compose up -d auth`.
  # Después de cambiar ESTE ARCHIVO: `docker compose up -d auth` (restart
  # no relee la configuración).
  # ------------------------------------------------------------------
  auth:
    environment:
      # Mínimo de la contraseña. Es el mismo número que `minLargoClave` en
      # public/js/config.js: si no coinciden, el formulario deja pasar una
      # contraseña que el servidor rechaza.
      GOTRUE_PASSWORD_MIN_LENGTH: "8"
      # Rechaza contraseñas que aparecen en filtraciones conocidas
      # ("12345678", "password1" y millones más): son las primeras que prueba
      # quien intenta adivinar contraseñas en serie, y esta población va a
      # reutilizar la de otras cuentas. Consulta Have I Been Pwned por k-anonimato: sólo viajan los
      # primeros 5 caracteres del hash, nunca la contraseña. Si ese servicio
      # no responde, deja pasar la contraseña: no traba los registros.
      GOTRUE_PASSWORD_HIBP_ENABLED: "true"

      # Vigencia de los enlaces de confirmación y de recuperación: 1 hora.
      # Con 10 minutos, quien abre el correo más tarde encuentra el botón
      # vencido. Es lo que dicen los correos: si se cambia, cambiarlos.
      GOTRUE_MAILER_OTP_EXP: "3600"
      # Tiempo mínimo entre dos correos a la misma dirección. El botón
      # "Reenviar" del sitio espera exactamente esto (js/auth.js): si no
      # coinciden, la persona toca el botón y recibe un error.
      GOTRUE_SMTP_MAX_FREQUENCY: "60s"
      # Tope GLOBAL de correos por hora, para toda la instancia. El valor
      # por defecto de Supabase es muy bajo: con un curso entero creando su
      # cuenta el primer día, los correos dejarían de salir en minutos.
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "200"

      # LÍMITE DE INTENTOS POR IP
      #
      # Sin esta línea GoTrue no limita NADA por IP: se pueden probar
      # contraseñas contra una cuenta sin freno. Necesita saber la IP real,
      # y detrás de Nginx y del gateway todas las conexiones le llegan desde
      # la misma dirección interna. El Vhost de CloudPanel ya manda la IP de
      # quien se conecta en X-Real-IP, y la pisa si el visitante intenta
      # mandar una propia.
      #
      # Supone que api.odontocampus.com.ar está en "DNS only" en Cloudflare.
      # Si alguna vez se pasa a "Proxied", la IP que ve Nginx es la de
      # Cloudflare y todo el país comparte un solo límite: hay que ajustar
      # esto antes de cambiarlo.
      #
      # Si el encabezado no llega, GoTrue no limita y lo avisa en el log:
      # "rate limiting is not applied". La guía explica cómo verificarlo.
      GOTRUE_RATE_LIMIT_HEADER: "X-Real-IP"
      # Ingresos y renovaciones de sesión por IP, cada 5 minutos. No se baja
      # más: el wifi de la facultad sale a internet con UNA sola IP para
      # cientos de estudiantes.
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "300"

      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Confirmá tu cuenta de OdontoCampus"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Elegí una contraseña nueva para OdontoCampus"
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: "https://odontocampus.com.ar/email/confirmacion.html?v=20260912"
      GOTRUE_MAILER_TEMPLATES_RECOVERY: "https://odontocampus.com.ar/email/recuperar.html?v=20260912"
